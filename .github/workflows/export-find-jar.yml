name: Export find jar
on:
  push:
    branches: [claude/export-find-jar]
jobs:
  export:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: find-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
      - name: Print the jar
        run: |
          ls -l build/libs
          unzip -l build/libs/urinth-find-*.jar
          unzip -p build/libs/urinth-find-*.jar fabric.mod.json
          sha256sum build/libs/urinth-find-*.jar
          echo "JAR-BASE64-BEGIN"
          base64 -w0 build/libs/urinth-find-*.jar
          echo
          echo "JAR-BASE64-END"
