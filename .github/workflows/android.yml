name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  sunflare-mod:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: sunflare-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the sun flare mod
        run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: urinth-sunflare-jar
          path: sunflare-mod/build/libs/urinth-sunflare-*.jar

  find-mod:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: find-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the find mod
        run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: urinth-find-jar
          path: find-mod/build/libs/urinth-find-*.jar

  optimizer-mod:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: optimizer-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the optimizer mod
        run: ./gradlew build --no-daemon --stacktrace
      - name: Show what the game looks like to the mod
        if: always()
        run: |
          for f in log classes callers search bytecode; do
            if [ -f "build/probe/$f.txt" ]; then
              echo "::group::probe $f"
              cat "build/probe/$f.txt"
              echo "::endgroup::"
            fi
          done
      - name: Show what is in the optimizer mod jar
        if: always()
        run: |
          bash ci/show-mixin-strings.sh
          for jar in build/libs/urinth-optimizer-*.jar; do
            echo "::group::$jar"
            unzip -l "$jar"
            echo "::endgroup::"
            echo "::group::mixin configuration and refmap (the names the game has outside the dev environment)"
            unzip -p "$jar" urinth_optimizer.mixins.json || true
            for r in $(unzip -Z1 "$jar" | grep -i refmap); do echo "--- $r"; unzip -p "$jar" "$r"; done
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: urinth-optimizer-jar
          path: optimizer-mod/build/libs/urinth-optimizer-*.jar
      - name: Check the jar carries the mapping table the game needs
        run: |
          jar=$(ls build/libs/urinth-optimizer-*.jar | head -1)
          unzip -p "$jar" urinth_optimizer.mixins.json | grep -q '"refmap"' || { echo "the mixin configuration has no refmap entry"; exit 1; }
          refmap=$(unzip -p "$jar" urinth-optimizer-refmap.json) || { echo "the jar has no refmap"; exit 1; }
          for m in GameRendererMixin LevelRendererMixin PlayerListMixin SectionOcclusionGraphMixin SectionRenderDispatcherMixin; do
            echo "$refmap" | grep -q "dev/urinth/optimizer/mixin/$m" || { echo "the refmap has no entry for $m"; exit 1; }
          done
          echo "refmap ok"

  # Starts a real Fabric 1.21.4 server (the game as the launcher runs it, not the dev environment) with the built mod and
  # looks for the mod's own log lines. It is only a report: the app does not wait for it.
  optimizer-smoke:
    needs: optimizer-mod
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: urinth-optimizer-jar
          path: mod-jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Start a Fabric server with the mod
        run: |
          set -e
          MC=$(grep '^minecraft_version=' optimizer-mod/gradle.properties | cut -d= -f2)
          LOADER=$(grep '^loader_version=' optimizer-mod/gradle.properties | cut -d= -f2)
          API=$(grep '^fabric_api_version=' optimizer-mod/gradle.properties | cut -d= -f2)
          INSTALLER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | python3 -c "import sys,json; print([v['version'] for v in json.load(sys.stdin) if v['stable']][0])")
          echo "Minecraft $MC, loader $LOADER, installer $INSTALLER, Fabric API $API"
          mkdir -p server/mods
          cd server
          curl -fsSL -o fabric-server.jar "https://meta.fabricmc.net/v2/versions/loader/$MC/$LOADER/$INSTALLER/server/jar"
          curl -fsSL -o mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$API/fabric-api-$API.jar"
          cp ../mod-jar/urinth-optimizer-*.jar mods/
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=flat\nview-distance=10\nsimulation-distance=10\n' > server.properties
          set +e
          printf 'stop\n' | timeout 420 java -Xmx2g -jar fabric-server.jar nogui > ../server.log 2>&1
          echo "server exit code: $?"
      - name: What the mod said
        if: always()
        run: |
          echo "::group::mod, mixin and error lines"
          grep -n -i -E "optimizer|mixin|urinth|exception|error|Done \(" server.log | head -80 || true
          echo "::endgroup::"
          echo "::group::whole log"
          cat server.log
          echo "::endgroup::"
      - name: Check the mod loaded and its server hook is running
        run: |
          grep -q "\[Optimizer\] loaded" server.log || { echo "the mod did not report that it loaded"; exit 1; }
          grep -q "simulation distance hook is running" server.log || { echo "the simulation distance hook never ran: the mixin was not applied"; exit 1; }
          echo "mod loaded and its hook is running"

  build:
    needs: [sunflare-mod, find-mod, optimizer-mod]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      # The sun lens flare mod built above is bundled into the app. If it is missing the launcher just skips it.
      - name: Get the sun flare mod
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: urinth-sunflare-jar
          path: sunflare-jar
      - name: Bundle the sun flare mod
        continue-on-error: true
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/mods
          cp sunflare-jar/urinth-sunflare-*.jar app_pojavlauncher/src/main/assets/mods/urinth-sunflare.jar

      # The /find chat command mod built above is bundled too and put into Fabric 1.21.4 instances once.
      - name: Get the find mod
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: urinth-find-jar
          path: find-jar
      - name: Bundle the find mod
        continue-on-error: true
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/mods
          cp find-jar/urinth-find-*.jar app_pojavlauncher/src/main/assets/mods/urinth-find.jar

      # The optimizer mod (adaptive render distance, client and server tuning) is bundled the same way.
      - name: Get the optimizer mod
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: urinth-optimizer-jar
          path: optimizer-jar
      - name: Bundle the optimizer mod
        continue-on-error: true
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/mods
          cp optimizer-jar/urinth-optimizer-*.jar app_pojavlauncher/src/main/assets/mods/urinth-optimizer.jar

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      # URinth build of LTW (shader cache and fixes). If it is not available the official LTW above stays.
      - name: Get URinth LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: UrinthH/LTW
          workflow: android.yml
          workflow_conclusion: success
          branch: urinth
          name: output-aar
          path: app_pojavlauncher/libs
          if_no_artifact_found: warn

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6  
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create out directory
        run: mkdir out
      - name: Validate VulkanMod patch script
        run: |
          bash -n scripts/patch_vulkanmod.sh
          bash -n scripts/tests/test_patch_vulkanmod.sh
          bash scripts/tests/test_patch_vulkanmod.sh
      - name: Test the OpenSL microphone preset helpers
        run: |
          gcc -Wall -Wextra -fsanitize=address,undefined -g -I app_pojavlauncher/src/main/jni \
            app_pojavlauncher/src/test/native/opensl_preset_test.c app_pojavlauncher/src/main/jni/opensl_preset.c \
            -o /tmp/opensl_preset_test
          /tmp/opensl_preset_test
      - name: Test the voice chat library name check
        run: |
          gcc -Wall -Wextra -fsanitize=address,undefined -g -I app_pojavlauncher/src/main/jni \
            app_pojavlauncher/src/test/native/glibc_shim_test.c app_pojavlauncher/src/main/jni/glibc_shim_names.c \
            -o /tmp/glibc_shim_test
          /tmp/glibc_shim_test
      - name: Test URinthRender frame-time statistics
        run: |
          set -o pipefail
          gradle :app_pojavlauncher:testFullDebugUnitTest 2>&1 | tee /tmp/gradle-unit-tests.log
      - name: Show failing unit tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          shown = 0
          for path in glob.glob('app_pojavlauncher/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      text = (bad.get('message') or '') + ' | ' + (bad.text or '')[:600]
                      text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print('::error title=' + case.get('classname', '') + '.' + case.get('name', '') + '::' + text[:900])
                      shown += 1
          print('failing tests shown:', shown)
          try:
              lines = open('/tmp/gradle-unit-tests.log', errors='replace').read().splitlines()
          except OSError:
              lines = []
          picked = [l for l in lines if 'error:' in l or 'FAILED' in l or 'wrong' in l.lower()][:12]
          for line in picked:
              print('::error title=gradle::' + line.replace('%', '%25')[:600])
          PY
      - name: Build Publishing .aab
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleFullGplay
          mv app_pojavlauncher/build/outputs/bundle/fullGplay/app_pojavlauncher-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleFullDebug
          mv app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/app-debug-full.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/app-debug-noruntime.apk
      - name: Build Nightly Release .apk
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:assembleFullPubRelease
          mv app_pojavlauncher/build/outputs/apk/full/pubRelease/app_pojavlauncher-full-pubRelease.apk out/MojoLauncher-release.apk
      - name: Gen md5sums
        run: |
          md5sum out/app-debug-full.apk > out/app-debug-full.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug-full.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.apk

      - name: Release Nightly APK
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: MojoLauncher Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            MojoLauncher nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/MojoLauncher-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'MojoLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: git.artdeell.mjlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
