name: Find jar dump

# Scratch run: builds only the find mod and prints the jar into the log, because the sandbox that wrote the
# mod cannot download from the artifact store. This branch is deleted again right after.
on:
  push:
    branches:
      - claude/find-jar-dump

jobs:
  dump:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: find-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run every test and print the results
        run: |
          ./gradlew test --no-daemon --stacktrace
          grep -h "<testsuite " build/test-results/test/*.xml | sed -E 's/ timestamp=.*//'
