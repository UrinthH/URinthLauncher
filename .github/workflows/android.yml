name: Boost 1.21.11 probe

# Scratch run, can be deleted. Finds the Fabric API version for Minecraft 1.21.11, shows what no longer compiles
# against 1.21.11, and prints the real method signatures of the classes the mod hooks.
on:
  push:
    branches:
      - claude/find-jar-dump

jobs:
  probe:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: boost-mod-1.21.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Which Fabric API versions exist for 1.21.11
        run: |
          curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml -o fapi.xml
          grep -o '<version>[^<]*</version>' fapi.xml | sed 's/<[^>]*>//g' | grep -E '\+1\.21\.11$' | sort -V | tail -4
          echo "FAPI-PICK $(grep -o '<version>[^<]*</version>' fapi.xml | sed 's/<[^>]*>//g' | grep -E '\+1\.21\.11$' | sort -V | tail -1)"
          curl -fsS "https://meta.fabricmc.net/v2/versions/loader/1.21.11" | head -c 400; echo
      - name: Compile against 1.21.11 (errors are expected; they show what changed)
        run: |
          FAPI=$(grep -o '<version>[^<]*</version>' fapi.xml | sed 's/<[^>]*>//g' | grep -E '\+1\.21\.11$' | sort -V | tail -1)
          ./gradlew compileJava --no-daemon -Pfabric_api_version=$FAPI 2>&1 | tee compile.log || true
          echo "=== COMPILE-ERRORS"
          grep -E "error:|warning: \[" compile.log | cut -c1-260 | head -60 || true
          echo "=== COMPILE-TAIL"
          tail -n 12 compile.log | cut -c1-260
      - name: Dump the signatures
        run: |
          JAR=""
          for j in $(find "$HOME/.gradle" "$GITHUB_WORKSPACE/boost-mod-1.21.11/.gradle" -name '*.jar' -path '*inecraft*' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/particle/ParticleEngine.class'; then JAR="$j"; break; fi
          done
          echo "MAPPED-JAR $JAR"
          test -n "$JAR"
          for d in 'client/particle' 'client/renderer/entity' 'client/renderer/entity/state' 'client/renderer/entity/layers' 'client/renderer/state' 'client/renderer/feature' 'client/renderer'; do
            echo "=== CLASS-LIST $d"
            unzip -Z1 "$JAR" | grep -E "^net/minecraft/$d/[A-Za-z0-9]+\.class$" | sed 's/\.class$//; s|.*/||' | tr '\n' ' ' | fold -w 220
            echo
          done
          FULL="net.minecraft.client.particle.ParticleEngine net.minecraft.client.particle.Particle net.minecraft.client.renderer.entity.EntityRenderDispatcher net.minecraft.client.renderer.entity.EntityRenderer net.minecraft.client.renderer.entity.LivingEntityRenderer net.minecraft.client.renderer.entity.state.EntityRenderState net.minecraft.client.renderer.entity.state.LivingEntityRenderState net.minecraft.client.renderer.entity.state.HumanoidRenderState net.minecraft.client.renderer.entity.layers.RenderLayer net.minecraft.client.renderer.entity.layers.HumanoidArmorLayer net.minecraft.client.renderer.entity.layers.ItemInHandLayer net.minecraft.client.renderer.entity.layers.CapeLayer net.minecraft.client.renderer.SubmitNodeCollector net.minecraft.client.renderer.state.CameraRenderState net.minecraft.client.DeltaTracker"
          for c in $FULL; do
            echo "=== CLASS $c"
            javap -p -s -cp "$JAR" "$c" || echo "MISSING $c"
          done
          filtered() {
            echo "=== FILTERED $1 /$2/"
            javap -p -s -cp "$JAR" "$1" | grep -E -A1 "$2" | grep -v '^--$' || echo "MISSING $1"
          }
          filtered net.minecraft.client.Minecraft 'fps|Fps|[Ff]rame|getInstance|particleEngine|levelRenderer|entityRenderDispatcher|stop\(|isPaused|getWindow'
          filtered net.minecraft.world.entity.Entity 'shouldRender|getBoundingBox\(|distanceToSqr|getViewScale|isInvisible'
          echo "=== DONE"
