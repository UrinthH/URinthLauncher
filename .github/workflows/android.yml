name: Boost probe

# Scratch run, can be deleted. It does two things the sandbox that writes the mods cannot do:
#  1. api:   prints the exact method signatures of the Minecraft 1.21.4 classes a mod wants to hook, so no hook is guessed.
#  2. smoke: starts the real Minecraft client headless (virtual screen, software OpenGL) with a known-good mod,
#            to find out whether a headless start-up check works in CI.
on:
  push:
    branches:
      - claude/find-jar-dump

jobs:
  api:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: find-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile (this creates the mapped Minecraft jar)
        run: ./gradlew compileJava --no-daemon
      - name: Dump the signatures
        run: |
          JAR=""
          for j in $(find "$HOME/.gradle" "$GITHUB_WORKSPACE/find-mod/.gradle" -name '*.jar' -path '*inecraft*' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/particle/ParticleEngine.class'; then JAR="$j"; break; fi
          done
          echo "MAPPED-JAR $JAR"
          test -n "$JAR"
          echo "=== CLASS-LIST particle"
          unzip -Z1 "$JAR" | grep -E '^net/minecraft/client/particle/[A-Za-z0-9]+\.class$' | sed 's/\.class$//' | tr '\n' ' ' | fold -w 200
          echo
          echo "=== CLASS-LIST renderer/entity"
          unzip -Z1 "$JAR" | grep -E '^net/minecraft/client/renderer/entity/(state/|layers/)?[A-Za-z0-9]+\.class$' | sed 's/\.class$//' | tr '\n' ' ' | fold -w 200
          echo
          FULL="net.minecraft.client.particle.ParticleEngine net.minecraft.client.particle.Particle net.minecraft.client.particle.ParticleRenderType net.minecraft.client.renderer.entity.EntityRenderDispatcher net.minecraft.client.renderer.entity.EntityRenderer net.minecraft.client.renderer.entity.LivingEntityRenderer net.minecraft.client.renderer.entity.state.EntityRenderState net.minecraft.client.renderer.entity.state.LivingEntityRenderState net.minecraft.client.renderer.entity.layers.RenderLayer net.minecraft.client.renderer.entity.layers.HumanoidArmorLayer net.minecraft.client.renderer.entity.layers.ItemInHandLayer net.minecraft.client.renderer.entity.layers.CapeLayer net.minecraft.client.Camera net.minecraft.client.DeltaTracker net.minecraft.client.ParticleStatus net.minecraft.client.renderer.culling.Frustum net.minecraft.client.renderer.entity.ItemEntityRenderer net.minecraft.client.renderer.entity.ArmorStandRenderer net.minecraft.client.renderer.entity.ExperienceOrbRenderer"
          for c in $FULL; do
            echo "=== CLASS $c"
            javap -p -s -cp "$JAR" "$c" || echo "MISSING $c"
          done
          filtered() {
            echo "=== FILTERED $1 /$2/"
            javap -p -s -cp "$JAR" "$1" | grep -E -A1 "$2" | grep -v '^--$' || echo "MISSING $1"
          }
          filtered net.minecraft.client.Minecraft 'fps|Fps|[Ff]rame|runTick|getInstance|particleEngine|levelRenderer|entityRenderDispatcher|stop\(|isPaused|getTimer|getDeltaTracker|getWindow|gameRenderer'
          filtered net.minecraft.client.renderer.LevelRenderer 'addParticle|renderEntities|renderEntity|collect|shouldRender|extractVisible|renderLevel|addMainPass|addCloudsPass|renderClouds|entityRenderDispatcher|visibleEntities|renderSnowAndRain|addWeatherPass|renderSky|addSkyPass|renderParticles|addParticlesPass'
          filtered net.minecraft.world.entity.Entity 'shouldRender|noCulling|getBoundingBox|distanceToSqr|getViewScale|setViewScale|getBoundingBoxForCulling|isInvisible|getType\('
          filtered net.minecraft.client.renderer.GameRenderer 'render\(|renderLevel|getMainCamera|getRenderDistance|isPanoramaMode'
          echo "=== DONE"

  smoke:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: find-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Packages for a headless client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libglu1-mesa libegl1 libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1 libxrender1 libxext6 libx11-6 mesa-utils x11-utils
      - name: Start the real client on a virtual screen
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset > xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 3
          glxinfo -B 2>&1 | head -25 || true
          (./gradlew runClient --no-daemon --console=plain > run.log 2>&1; echo "GRADLE-EXIT $?" >> run.log) &
          RESULT="TIMEOUT"
          for i in $(seq 1 150); do
            sleep 5
            if grep -q "GRADLE-EXIT" run.log; then RESULT="EXITED"; break; fi
            if grep -q "Minecraft Crash Report" run.log; then RESULT="CRASH"; break; fi
            if grep -q "particles.png-atlas" run.log; then sleep 20; RESULT="REACHED-ATLAS-STAGE"; break; fi
          done
          echo "SMOKE-RESULT $RESULT after about $((i*5)) s"
          echo "=== run.log tail"
          tail -n 80 run.log | cut -c1-300
          echo "=== game log (selected)"
          grep -n -E "Mixin|mixin|Backend library|OpenGL|Reloading ResourceManager|Created:|Loading [0-9]+ mods|urinth|ERROR|FATAL|Exception" run/logs/latest.log 2>/dev/null | cut -c1-300 | head -80
          pkill -f KnotClient || true
          pkill -f gradle || true
          pkill Xvfb || true
          test "$RESULT" = "REACHED-ATLAS-STAGE"
