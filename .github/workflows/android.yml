name: API probe 2

# Scratch run: a few more questions about the Minecraft 1.21.4 classes (Mojang names). This branch can be deleted.
on:
  push:
    branches:
      - claude/find-jar-dump

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare the mapped Minecraft jar
        working-directory: find-mod
        run: ./gradlew build --no-daemon -x test
      - name: Questions
        run: |
          set +e
          J=""
          for j in $(find "$HOME/.gradle" "$GITHUB_WORKSPACE/find-mod/.gradle" -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/particle/ParticleEngine.class'; then J="$j"; break; fi
          done
          echo "JAR $J"
          for n in net/minecraft/client/renderer/entity/state/HumanoidRenderState net/minecraft/client/renderer/entity/state/PlayerRenderState net/minecraft/client/renderer/entity/state/ArmorStandRenderState net/minecraft/world/entity/item/ItemEntity net/minecraft/world/entity/ExperienceOrb net/minecraft/world/entity/decoration/ArmorStand net/minecraft/world/entity/player/Player net/minecraft/world/entity/LivingEntity net/minecraft/client/gui/Gui net/minecraft/core/particles/ParticleGroup; do
            if unzip -l "$J" | grep -q "$n.class"; then echo "yes $n"; else echo "NO  $n"; fi
          done
          echo "--- classes under client/renderer/entity that mention shouldRenderLayers"
          unzip -Z1 "$J" | grep -E '^net/minecraft/client/renderer/entity/[A-Za-z0-9_$]*\.class$' | sed 's/\.class$//; s#/#.#g' | while read c; do
            javap -p -cp "$J" "$c" 2>/dev/null | grep -q 'shouldRenderLayers' && echo "  $c"
          done
          echo "--- HumanoidRenderState"
          javap -p -s -cp "$J" net.minecraft.client.renderer.entity.state.HumanoidRenderState | head -40
          echo "--- Entity.distanceToSqr and getBoundingBox"
          javap -p -s -cp "$J" net.minecraft.world.entity.Entity | grep -A1 -E 'distanceToSqr|getBoundingBox\(|isPassenger|getVehicle'
          echo "--- Minecraft: screen, level, player, camera entity, gui"
          javap -p -s -cp "$J" net.minecraft.client.Minecraft | grep -A1 -E ' screen;| level;| player;|getCameraEntity|cameraEntity| gui;|isSingleplayer|getCurrentServer|hasSingleplayerServer'
          echo "--- Gui overlay message"
          javap -p -s -cp "$J" net.minecraft.client.gui.Gui | grep -A1 -E 'setOverlayMessage|overlayMessage'
          echo "--- AABB fields"
          javap -p -cp "$J" net.minecraft.world.phys.AABB | grep -E 'minX|maxX|getSize|getCenter|getXsize'
          echo "--- bytecode of shouldRenderLayers in LivingEntityRenderer"
          javap -p -c -cp "$J" net.minecraft.client.renderer.entity.LivingEntityRenderer | awk '/protected boolean shouldRenderLayers/{p=1} p{print} /ireturn/{if(p){exit}}'
          echo "PROBE2-DONE"
