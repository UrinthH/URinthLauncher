name: Find jar dump

# Scratch run: builds only the find mod and prints the jar into the log, because the sandbox that wrote the
# mod cannot download from the artifact store. This branch is deleted again right after.
on:
  push:
    branches:
      - claude/find-jar-dump

jobs:
  dump:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: find-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the jar
        run: ./gradlew remapJar --no-daemon --stacktrace
      - name: Print the jar
        run: |
          ls -l build/libs
          sha256sum build/libs/urinth-find-*.jar
          unzip -l build/libs/urinth-find-*.jar
          echo "JAR-BEGIN"
          base64 -w 100 build/libs/urinth-find-*.jar
          echo "JAR-END"
      - name: Run every test, plus the extra wire test
        continue-on-error: true
        run: ./gradlew test --no-daemon --stacktrace --info 2>&1 | grep -E " PASSED| FAILED| SKIPPED|error:|BUILD|tests completed|WireTest|Exception" | head -150
