name: Find jar dump

# Scratch run: builds only the find mod and prints the jar into the log, because the sandbox that wrote the
# mod cannot download from the artifact store. This branch can be deleted.
on:
  push:
    branches:
      - claude/find-jar-dump

jobs:
  dump:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: find-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the jar and run every test
        run: ./gradlew build --no-daemon --stacktrace
      - name: Test results
        run: |
          grep -h "<testsuite " build/test-results/test/*.xml | sed -E 's/ timestamp=.*//'
      - name: Print the jar
        run: |
          ls -l build/libs
          sha256sum build/libs/urinth-find-*.jar
          unzip -l build/libs/urinth-find-*.jar
          echo "JAR-BEGIN"
          base64 -w 100 build/libs/urinth-find-1.1.0.jar
          echo "JAR-END"
