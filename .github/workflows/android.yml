name: Sodium page probe

# Scratch run, can be deleted. Downloads the exact Sodium-family mods the player runs (1.21.4) and prints the real class
# signatures, so the video settings page of the sun flare mod is written against what really exists.
on:
  push:
    branches:
      - claude/find-jar-dump

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download the mods
        run: |
          mkdir -p mods
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          H = {'User-Agent': 'UrinthH/URinthLauncher-ci (scratch probe)'}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=H))
          for slug, want in [('sodium', '0.6.13'), ('reeses-sodium-options', '1.8.3'), ('sodium-extra', '0.6.1'), ('moreculling', '1.2.10')]:
              q = urllib.parse.urlencode({'game_versions': json.dumps(['1.21.4']), 'loaders': json.dumps(['fabric'])})
              vs = json.load(get('https://api.modrinth.com/v2/project/%s/version?%s' % (slug, q)))
              print('==', slug, [v['version_number'] for v in vs][:14])
              pick = [v for v in vs if want in v['version_number']]
              if not pick:
                  print('NOT FOUND', slug, want)
                  continue
              files = pick[0]['files']
              f = ([x for x in files if x.get('primary')] or files)[0]
              print('PICK', slug, pick[0]['version_number'], pick[0]['id'], f['filename'])
              with open('mods/%s.jar' % slug, 'wb') as out:
                  out.write(get(f['url']).read())
          PY
          ls -l mods
      - name: Class lists
        run: |
          for j in sodium reeses-sodium-options sodium-extra moreculling; do
            echo "=== classes of $j (gui / option / mixin related)"
            unzip -Z1 mods/$j.jar | grep '\.class$' | grep -i -E 'gui|option|screen|page|mixin' | head -150
          done
      - name: Sodium option API signatures
        run: |
          J=mods/sodium.jar
          for c in $(unzip -Z1 $J | grep '\.class$' | grep -E 'client/gui/(SodiumOptionsGUI|options/|SodiumGameOptions)' | sed 's/\.class$//; s|/|.|g'); do
            echo "##### $c"; javap -p -cp $J "$c" 2>&1 | cut -c1-240
          done
      - name: Sodium client gui, the rest of the package
        run: |
          J=mods/sodium.jar
          for c in $(unzip -Z1 $J | grep '\.class$' | grep -E 'client/gui/' | grep -v -E 'client/gui/(SodiumOptionsGUI|options/)' | sed 's/\.class$//; s|/|.|g' | head -60); do
            echo "##### $c"; javap -p -cp $J "$c" 2>&1 | cut -c1-200
          done
      - name: How SodiumOptionsGUI builds its page list (bytecode)
        run: |
          javap -p -c -cp mods/sodium.jar net.caffeinemc.mods.sodium.client.gui.SodiumOptionsGUI 2>&1 | cut -c1-230 | head -400
      - name: Reese's Sodium Options, signatures
        run: |
          J=mods/reeses-sodium-options.jar
          for c in $(unzip -Z1 $J | grep '\.class$' | grep -v -E 'lambda' | sed 's/\.class$//; s|/|.|g' | head -140); do
            echo "##### $c"; javap -p -cp $J:mods/sodium.jar "$c" 2>&1 | cut -c1-220 | head -60
          done
      - name: How other addons add their pages (annotations)
        run: |
          for j in sodium-extra moreculling reeses-sodium-options; do
            J=mods/$j.jar
            for c in $(unzip -Z1 $J | grep '\.class$' | grep -i 'mixin' | sed 's/\.class$//; s|/|.|g'); do
              if javap -v -p -cp $J:mods/sodium.jar "$c" 2>/dev/null | grep -q -E 'SodiumOptionsGUI|OptionPage|VideoSettings'; then
                echo "##### $j :: $c"
                javap -v -p -cp $J:mods/sodium.jar "$c" 2>&1 | grep -E 'InvisibleAnnotations|Mixin|Inject|method=|target=|ordinal|shift|value=|at=|Shadow|Final|class |descriptor' | cut -c1-260 | head -80
              fi
            done
          done
      - name: Page builders of the other addons (bytecode of the class that makes OptionPage)
        run: |
          for j in sodium-extra moreculling; do
            J=mods/$j.jar
            for c in $(unzip -Z1 $J | grep '\.class$' | grep -v -i 'mixin' | sed 's/\.class$//; s|/|.|g'); do
              if javap -v -p -cp $J:mods/sodium.jar "$c" 2>/dev/null | grep -q -E 'OptionPage'; then
                echo "##### $j :: $c"
                javap -p -cp $J:mods/sodium.jar "$c" 2>&1 | cut -c1-240 | head -50
              fi
            done
          done
