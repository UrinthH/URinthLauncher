name: Import real Minecraft artwork

on:
  push:
    branches:
      - feature/urinthultra-home-visual-refresh-339ceb7
    paths:
      - .github/workflows/import-real-minecraft-art.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/urinthultra-home-visual-refresh-339ceb7
          fetch-depth: 0
      - name: Download official Minecraft artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/minecraft-art /tmp/minecraft-wallpapers app_pojavlauncher/src/main/res/drawable-nodpi
          curl --http1.1 -fL --retry 3 --retry-all-errors 'https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/logos/icon_javaeditionlogo.jpg' -o /tmp/minecraft-art/java-logo.jpg
          curl -fL --retry 3 'https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/software/wallpapers_minecraft_pc_bundle.zip' -o /tmp/minecraft-art/wallpapers.zip
          python3 - <<'PY'
          import os, zipfile, shutil
          from pathlib import Path
          archive = '/tmp/minecraft-art/wallpapers.zip'
          root = Path('/tmp/minecraft-wallpapers')
          with zipfile.ZipFile(archive) as z:
              z.extractall(root)
          files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp'}]
          if not files:
              raise SystemExit('No raster wallpapers found in official Minecraft bundle')
          def score(p, terms):
              n=p.name.lower()
              return sum(8 for t in terms if t in n) + min(p.stat().st_size // 100000, 20)
          # Prefer actual Java/Overworld, Nether and scenic images when the bundle names them.
          groups = [
              ('urinth_photo_hero.jpg', ['java','overworld','landscape','vista','panorama','wallpaper']),
              ('urinth_photo_banner.jpg', ['overworld','landscape','vista','panorama','wallpaper']),
              ('urinth_photo_news_1.jpg', ['overworld','landscape','vista','java']),
              ('urinth_photo_news_2.jpg', ['nether','portal','crimson']),
              ('urinth_photo_news_3.jpg', ['mountain','cave','trails','tales','landscape','vista']),
          ]
          chosen=set()
          for out, terms in groups:
              candidates=sorted((p for p in files if p not in chosen), key=lambda p: score(p,terms), reverse=True)
              src=next((p for p in candidates if any(t in p.name.lower() for t in terms)), candidates[0] if candidates else None)
              if src is None: raise SystemExit('Could not select wallpaper for '+out)
              dst=Path('app_pojavlauncher/src/main/res/drawable-nodpi')/out
              shutil.copyfile(src,dst)
              chosen.add(src)
              print(f'{out} <= {src} ({src.stat().st_size} bytes)')
          shutil.copyfile('app_pojavlauncher/src/main/res/drawable-nodpi/urinth_photo_hero.jpg','app_pojavlauncher/src/main/res/drawable-nodpi/urinth_photo_banner.jpg')
          shutil.copyfile('/tmp/minecraft-art/java-logo.jpg','app_pojavlauncher/src/main/res/drawable-nodpi/urinth_java_logo.jpg')
          # Enable the official logo only after its image resource exists, so intermediate commits build.
          layout = Path('app_pojavlauncher/src/main/res/layout/view_urinth_home.xml')
          xml = layout.read_text()
          start = xml.index('<ImageView\\n                                android:id="@+id/urinth_java_edition_logo"')
          end = xml.index('/>', start) + 2
          block = xml[start:end]
          block = block.replace('                                android:visibility="gone"\\n', '')
          block = block.replace('android:src="@drawable/urinth_home_block"', 'android:src="@drawable/urinth_java_logo"')
          if 'android:src="@drawable/urinth_java_logo"' not in block:
              raise SystemExit('Could not activate official Minecraft Java logo in the home layout')
          layout.write_text(xml[:start] + block + xml[end:])
          PY
      - name: Remove drawn placeholder artwork
        run: |
          rm -f app_pojavlauncher/src/main/res/drawable/urinth_photo_hero.xml
          rm -f app_pojavlauncher/src/main/res/drawable/urinth_photo_news_1.xml
          rm -f app_pojavlauncher/src/main/res/drawable/urinth_photo_news_2.xml
          rm -f app_pojavlauncher/src/main/res/drawable/urinth_photo_news_3.xml
      - name: Commit raster artwork
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app_pojavlauncher/src/main/res/drawable-nodpi app_pojavlauncher/src/main/res/drawable/urinth_photo_*.xml app_pojavlauncher/src/main/res/layout/view_urinth_home.xml
          if git diff --cached --quiet; then
            echo 'No artwork changes to commit.'
            exit 0
          fi
          git commit -m 'Replace drawn placeholders with real Minecraft artwork'
          git push origin HEAD:feature/urinthultra-home-visual-refresh-339ceb7
