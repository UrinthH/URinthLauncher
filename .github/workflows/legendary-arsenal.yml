name: Legendary Arsenal mod

# Builds the Legendary Arsenal mod (a resource pack of 3D first-person weapons that Fabric API switches on by default) and tests the
# finished jar. It only runs when the mod changes, so it does not slow down the launcher build.
on:
  push:
    paths:
      - 'legendary-arsenal-mod/**'
      - '.github/workflows/legendary-arsenal.yml'
  workflow_dispatch:

jobs:
  legendary-arsenal-mod:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: legendary-arsenal-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the Legendary Arsenal mod
        run: ./gradlew build --no-daemon --stacktrace
      - name: Show what is in the jar
        if: always()
        run: |
          for jar in build/libs/urinth-legendary-arsenal-*.jar; do
            echo "::group::$jar"
            unzip -l "$jar" | tail -n +1
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: urinth-legendary-arsenal-jar
          path: legendary-arsenal-mod/build/libs/urinth-legendary-arsenal-*.jar
      # The storage host of workflow artifacts cannot be reached from the sandbox the assistant works in, the job log can. The jar is
      # printed in 3000-character lines between two markers and rebuilt from the log. The checksum is printed first to check the copy.
      - name: Print the jar (so it can be fetched from this log)
        run: |
          jar=$(ls build/libs/urinth-legendary-arsenal-*.jar | head -1)
          ls -l "$jar"
          echo "JAR-SHA256 $(sha256sum "$jar" | cut -d' ' -f1)"
          echo "JAR-BASE64-BEGIN"
          base64 -w 3000 "$jar"
          echo "JAR-BASE64-END"
