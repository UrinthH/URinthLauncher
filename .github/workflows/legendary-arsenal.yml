name: Legendary Arsenal mod

# Builds the Legendary Arsenal mod (a resource pack of 3D first-person weapons that Fabric API switches on by default) and tests the
# finished jar. It only runs when the mod changes, so it does not slow down the launcher build.
on:
  push:
    paths:
      - 'legendary-arsenal-mod/**'
      - '.github/workflows/legendary-arsenal.yml'
  workflow_dispatch:

jobs:
  legendary-arsenal-mod:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: legendary-arsenal-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the Legendary Arsenal mod
        run: ./gradlew build --no-daemon --stacktrace
      - name: Show what is in the jar
        if: always()
        run: |
          for jar in build/libs/urinth-legendary-arsenal-*.jar; do
            echo "::group::$jar"
            unzip -l "$jar" | tail -n +1
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: urinth-legendary-arsenal-jar
          path: legendary-arsenal-mod/build/libs/urinth-legendary-arsenal-*.jar
