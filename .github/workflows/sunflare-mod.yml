name: Sun flare mod

on:
  push:
    paths:
      - 'sunflare-mod/**'
      - '.github/workflows/sunflare-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: sunflare-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: urinth-sunflare-jar
          path: sunflare-mod/build/libs/urinth-sunflare-*.jar
