org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric (Minecraft 1.21.4)
minecraft_version=1.21.4
# The loader the launcher installs and the game runs with (0.17.3: Mixin 0.16.5, MixinExtras 0.5.0). The mod is built against
# exactly that. A newer loader builds against a newer Mixin, which writes the mod's @Redirect with "at" as a list; MixinExtras
# 0.5.0 cannot read that and stops the game at start ("Mixin transformation of ... failed"). Do not raise this without
# running the whole checks (MixinShapeTest) and a client start.
loader_version=0.17.3
loom_version=1.19-SNAPSHOT
fabric_api_version=0.119.4+1.21.4

mod_version=1.0.1
