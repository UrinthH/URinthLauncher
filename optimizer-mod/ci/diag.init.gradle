// Temporary: shows how the Java compile of the mod is set up for the mixin annotation processor.
allprojects {
    afterEvaluate { p ->
        try {
            def loom = p.extensions.findByName('loom')
            println "DIAG loom extension: " + (loom != null)
            if (loom != null) {
                try { println "DIAG loom.mixin.useLegacyMixinAp = " + loom.mixin.useLegacyMixinAp.get() } catch (Throwable t) { println "DIAG useLegacyMixinAp: " + t }
                try { println "DIAG loom.mixin.defaultRefmapName = " + loom.mixin.defaultRefmapName.get() } catch (Throwable t) { println "DIAG defaultRefmapName: " + t }
            }
            println "DIAG annotationProcessor deps = " + p.configurations.annotationProcessor.dependencies.collect { it.group + ':' + it.name + ':' + it.version }
            println "DIAG compileClasspath mixin = " + p.configurations.compileClasspath.files.findAll { it.name.toLowerCase().contains('mixin') }*.name
        } catch (Throwable t) {
            println "DIAG afterEvaluate failed: " + t
        }
        p.tasks.matching { it.name == 'compileJava' }.configureEach { t ->
            t.doFirst {
                println "DIAG compileJava processorpath = " + t.options.annotationProcessorPath?.files*.name
                println "DIAG compileJava compilerArgs = " + t.options.compilerArgs
                println "DIAG javac = " + t.javaCompiler.get().metadata.languageVersion
            }
        }
    }
}
