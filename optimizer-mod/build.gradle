plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = 'dev.urinth'
base { archivesName = 'urinth-optimizer' }

repositories {
	mavenCentral()
}

configurations {
	mixinExtrasCheck
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
	// Reads class files (not loading them) so the tests can check every mixin target against the real game.
	testImplementation 'org.ow2.asm:asm-tree:9.7.1'

	// Only for the checkMixinExtras task: the MixinExtras that ships with Fabric Loader 0.17.3 (the loader the game runs with).
	mixinExtrasCheck 'io.github.llamalad7:mixinextras-common:0.5.0'
}

loom {
	mixin {
		// Off by default in this Loom. With it on the jar gets a refmap, the table that tells the game, outside the dev
		// environment (where its classes have other names than in the source), what each hook is aimed at.
		useLegacyMixinAp = true
	}
}

test {
	useJUnitPlatform()
	maxHeapSize = '1g'
	// A failing check shows what failed in the CI log, not just that something did.
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
	// MixinShapeTest also reads the finished jar (after remapping), so the jar is built first.
	dependsOn tasks.named('remapJar')
	doFirst {
		systemProperty 'urinth.jar', tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath
	}
}

// Runs the real MixinExtras 0.5.0 transformer, the code that stopped the game at start, over the mod's mixin classes.
// Not part of build: it needs one more download, so CI runs it as its own step.
tasks.register('checkMixinExtras', Test) {
	group = 'verification'
	description = 'Runs MixinExtras 0.5.0 over the mixin classes of the finished jar'
	dependsOn tasks.named('remapJar')
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath + configurations.mixinExtrasCheck
	useJUnitPlatform()
	filter {
		includeTestsMatching 'dev.urinth.optimizer.MixinShapeTest'
	}
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
	doFirst {
		systemProperty 'urinth.jar', tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath
	}
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
